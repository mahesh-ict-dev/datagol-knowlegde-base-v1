<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentAI — Recruitment Intelligence</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #080d1a; color: #e2e8f0; min-height: 100vh; overflow-x: hidden; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #0f172a; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

/* Layout */
#app { display: flex; height: 100vh; overflow: hidden; }
#sidebar { width: 240px; min-width: 240px; background: #0d1526; border-right: 1px solid #1e2d4a; display: flex; flex-direction: column; overflow-y: auto; }
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#topbar { height: 60px; min-height: 60px; background: #0d1526; border-bottom: 1px solid #1e2d4a; display: flex; align-items: center; padding: 0 24px; gap: 16px; }
#content { flex: 1; overflow-y: auto; padding: 24px; }

/* Sidebar */
.sidebar-logo { padding: 20px 20px 16px; border-bottom: 1px solid #1e2d4a; }
.logo-text { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.logo-sub { font-size: 10px; color: #475569; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }

.nav-section { padding: 12px 12px 4px; font-size: 10px; color: #475569; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin: 1px 8px; border-radius: 8px; cursor: pointer; color: #64748b; font-size: 13.5px; font-weight: 500; transition: all 0.15s; }
.nav-item:hover { background: #1e2d4a; color: #94a3b8; }
.nav-item.active { background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(139,92,246,0.15)); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.3); }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
.nav-badge { margin-left: auto; background: #6366f1; color: white; font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 600; }

.sidebar-footer { margin-top: auto; padding: 16px; border-top: 1px solid #1e2d4a; }

/* Cards */
.card { background: #0d1526; border: 1px solid #1e2d4a; border-radius: 12px; padding: 20px; }
.card-sm { background: #0d1526; border: 1px solid #1e2d4a; border-radius: 10px; padding: 16px; }

/* KPI Cards */
.kpi-card { background: #0d1526; border: 1px solid #1e2d4a; border-radius: 12px; padding: 20px; position: relative; overflow: hidden; transition: border-color 0.2s; }
.kpi-card:hover { border-color: #334155; }
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.kpi-card.blue::before { background: linear-gradient(90deg, #3b82f6, #06b6d4); }
.kpi-card.purple::before { background: linear-gradient(90deg, #8b5cf6, #6366f1); }
.kpi-card.green::before { background: linear-gradient(90deg, #10b981, #34d399); }
.kpi-card.amber::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.kpi-val { font-size: 32px; font-weight: 800; color: #f1f5f9; line-height: 1; margin: 8px 0 4px; }
.kpi-label { font-size: 12px; color: #64748b; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
.kpi-change { font-size: 12px; font-weight: 600; margin-top: 8px; }
.kpi-change.up { color: #10b981; }
.kpi-change.down { color: #ef4444; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
.btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
.btn-secondary { background: #1e2d4a; color: #94a3b8; border: 1px solid #2d3f5c; }
.btn-secondary:hover { background: #253550; color: #e2e8f0; }
.btn-ghost { background: transparent; color: #64748b; }
.btn-ghost:hover { background: #1e2d4a; color: #94a3b8; }
.btn-danger { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
.btn-danger:hover { background: rgba(239,68,68,0.25); }
.btn-sm { padding: 5px 11px; font-size: 12px; }
.btn-xs { padding: 3px 8px; font-size: 11px; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-blue { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
.badge-purple { background: rgba(139,92,246,0.15); color: #a78bfa; border: 1px solid rgba(139,92,246,0.3); }
.badge-green { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
.badge-amber { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
.badge-red { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
.badge-gray { background: rgba(100,116,139,0.15); color: #94a3b8; border: 1px solid rgba(100,116,139,0.3); }

/* Score ring */
.score-ring { width: 52px; height: 52px; position: relative; display: inline-flex; align-items: center; justify-content: center; }
.score-ring svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }
.score-ring .score-num { font-size: 13px; font-weight: 700; color: #f1f5f9; z-index: 1; }

/* Upload zone */
.upload-zone { border: 2px dashed #2d3f5c; border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.2s; }
.upload-zone:hover, .upload-zone.drag-over { border-color: #6366f1; background: rgba(99,102,241,0.05); }
.upload-zone svg { width: 40px; height: 40px; color: #475569; margin: 0 auto 12px; }

/* Table */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { text-align: left; padding: 10px 14px; font-size: 11px; color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #1e2d4a; white-space: nowrap; }
.data-table td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid #111c2f; color: #94a3b8; vertical-align: middle; }
.data-table tr:hover td { background: rgba(30,45,74,0.4); }
.data-table td:first-child, .data-table th:first-child { padding-left: 20px; }

/* Search input */
.search-input { background: #111c2f; border: 1px solid #1e2d4a; border-radius: 8px; padding: 8px 12px 8px 36px; color: #e2e8f0; font-size: 13px; width: 240px; outline: none; }
.search-input:focus { border-color: #6366f1; }
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: #475569; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; }
.modal { background: #0d1526; border: 1px solid #1e2d4a; border-radius: 16px; width: 560px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
.modal-header { padding: 20px 24px; border-bottom: 1px solid #1e2d4a; display: flex; align-items: center; justify-content: space-between; }
.modal-body { padding: 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid #1e2d4a; display: flex; justify-content: flex-end; gap: 10px; }

/* Form */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12px; color: #64748b; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.form-input { width: 100%; background: #111c2f; border: 1px solid #1e2d4a; border-radius: 8px; padding: 9px 12px; color: #e2e8f0; font-size: 13px; outline: none; font-family: 'Inter', sans-serif; }
.form-input:focus { border-color: #6366f1; }
.form-select { width: 100%; background: #111c2f; border: 1px solid #1e2d4a; border-radius: 8px; padding: 9px 12px; color: #e2e8f0; font-size: 13px; outline: none; }
textarea.form-input { resize: vertical; min-height: 80px; }

/* Progress bar */
.progress-bar { height: 4px; background: #1e2d4a; border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; }

/* Toast */
#toast-container { position: fixed; top: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: #0d1526; border: 1px solid #1e2d4a; border-radius: 10px; padding: 12px 16px; font-size: 13px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); animation: slideIn 0.2s ease; min-width: 280px; }
.toast.success { border-left: 3px solid #10b981; }
.toast.error { border-left: 3px solid #ef4444; }
.toast.info { border-left: 3px solid #6366f1; }
@keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

/* Tabs */
.tabs { display: flex; gap: 2px; background: #0a1020; padding: 3px; border-radius: 9px; border: 1px solid #1e2d4a; }
.tab { padding: 6px 14px; border-radius: 7px; font-size: 12.5px; font-weight: 500; cursor: pointer; color: #475569; transition: all 0.15s; }
.tab.active { background: #1e2d4a; color: #e2e8f0; }
.tab:hover:not(.active) { color: #94a3b8; }

/* Candidate card */
.candidate-card { background: #0d1526; border: 1px solid #1e2d4a; border-radius: 12px; padding: 18px; transition: all 0.2s; cursor: pointer; }
.candidate-card:hover { border-color: #6366f1; box-shadow: 0 0 0 1px rgba(99,102,241,0.2); transform: translateY(-1px); }

/* Job card */
.job-card { background: #0d1526; border: 1px solid #1e2d4a; border-radius: 12px; padding: 20px; transition: all 0.2s; }
.job-card:hover { border-color: #334155; }

/* Match bar */
.match-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.match-label { font-size: 12px; color: #64748b; width: 110px; flex-shrink: 0; }
.match-track { flex: 1; height: 6px; background: #1e2d4a; border-radius: 3px; overflow: hidden; }
.match-fill { height: 100%; border-radius: 3px; }
.match-pct { font-size: 12px; font-weight: 600; width: 36px; text-align: right; }

/* Avatar */
.avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }

/* Page header */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.page-title { font-size: 22px; font-weight: 700; color: #f1f5f9; }
.page-sub { font-size: 13px; color: #475569; margin-top: 2px; }

/* Status dot */
.status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }

/* Skeleton */
.skeleton { background: linear-gradient(90deg, #111c2f 25%, #1a2840 50%, #111c2f 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.divider { height: 1px; background: #1e2d4a; margin: 20px 0; }

/* Chip */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; background: #111c2f; border: 1px solid #1e2d4a; border-radius: 20px; font-size: 11px; color: #94a3b8; }
</style>
</head>
<body>
<div id="app">
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-text">TalentAI</div>
      <div class="logo-sub">Recruitment Intelligence</div>
    </div>

    <div style="padding: 8px 0;">
      <div class="nav-section">Main</div>
      <div class="nav-item active" onclick="navigate('dashboard')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </div>
      <div class="nav-item" onclick="navigate('resumes')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Resumes
        <span class="nav-badge">3</span>
      </div>
      <div class="nav-item" onclick="navigate('candidates')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Candidates
      </div>

      <div class="nav-section">Jobs</div>
      <div class="nav-item" onclick="navigate('jobs')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        Job Postings
      </div>
      <div class="nav-item" onclick="navigate('matching')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
        Matching
        <span class="nav-badge" style="background:#10b981;">12</span>
      </div>

      <div class="nav-section">Config</div>
      <div class="nav-item" onclick="navigate('settings')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        API Settings
      </div>
    </div>

    <div class="sidebar-footer">
      <div style="display:flex;align-items:center;gap:10px;">
        <div class="avatar" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);">RA</div>
        <div>
          <div style="font-size:13px;font-weight:600;color:#e2e8f0;">Rachana A.</div>
          <div style="font-size:11px;color:#475569;">Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="main">
    <!-- TOPBAR -->
    <div id="topbar">
      <div id="breadcrumb" style="font-size:14px;font-weight:600;color:#94a3b8;">Dashboard</div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:12px;">
        <div class="search-wrap">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input class="search-input" placeholder="Search candidates, jobs..." id="global-search">
        </div>
        <button class="btn btn-primary btn-sm" onclick="openModal('add-candidate')">
          <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Candidate
        </button>
        <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;">RA</div>
      </div>
    </div>

    <!-- CONTENT -->
    <div id="content"></div>
  </main>
</div>

<!-- MODALS -->
<div id="modal-container"></div>
<div id="toast-container"></div>

<script>
// ============================================================
// STATE
// ============================================================
const state = {
  page: 'dashboard',
  apiConfig: (() => {
    const saved = JSON.parse(localStorage.getItem('datagol_config') || '{}');
    // Pre-seed the known service-account token if nothing is saved yet
    if (!saved.token) saved.token = '87a5a1993724174cdac4044749c4469e7cda50bb769bd916cbe22f697380b07c';
    return saved;
  })(),
  _unmatched: [],        // array of "candidateId-jobId" keys removed from matching
  _matchFilterCandidate: null,
  candidates: [],        // loaded from Datagol via /api/candidates
  jobs: [],              // loaded from Datagol via /api/jobs
  resumes: [],           // derived from candidates (resume_file_name + status)
};

const avatarColors = [
  'linear-gradient(135deg,#6366f1,#8b5cf6)',
  'linear-gradient(135deg,#0ea5e9,#06b6d4)',
  'linear-gradient(135deg,#10b981,#34d399)',
  'linear-gradient(135deg,#f59e0b,#fbbf24)',
  'linear-gradient(135deg,#ef4444,#f97316)',
];

function getInitials(name) { return name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2); }
function getAvatarColor(id) { return avatarColors[(id-1) % avatarColors.length]; }

function scoreColor(s) {
  if (s >= 85) return '#10b981';
  if (s >= 70) return '#6366f1';
  if (s >= 55) return '#f59e0b';
  return '#ef4444';
}

function statusBadge(s) {
  const map = {
    new: ['badge-blue','New'],
    reviewed: ['badge-purple','Reviewed'],
    shortlisted: ['badge-green','Shortlisted'],
    rejected: ['badge-red','Rejected'],
    active: ['badge-green','Active'],
    draft: ['badge-gray','Draft'],
    closed: ['badge-red','Closed'],
  };
  const [cls, label] = map[s] || ['badge-gray', s];
  return `<span class="badge ${cls}">${label}</span>`;
}

function scoreRing(score, size=52) {
  const r = 20; const c = 2*Math.PI*r;
  const fill = (score/100)*c;
  const color = scoreColor(score);
  return `<div class="score-ring" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 44 44">
      <circle cx="22" cy="22" r="${r}" stroke="#1e2d4a" stroke-width="3" fill="none"/>
      <circle cx="22" cy="22" r="${r}" stroke="${color}" stroke-width="3" fill="none"
        stroke-dasharray="${fill} ${c}" stroke-linecap="round"/>
    </svg>
    <span class="score-num" style="color:${color};font-size:${size<52?'11px':'13px'}">${score}</span>
  </div>`;
}

// ============================================================
// ROUTING
// ============================================================
function navigate(page) {
  state.page = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const nav = document.querySelector(`.nav-item[onclick="navigate('${page}')"]`);
  if (nav) nav.classList.add('active');
  const titles = { dashboard:'Dashboard', resumes:'Resumes', candidates:'Candidates', jobs:'Job Postings', matching:'Matching', settings:'API Settings' };
  document.getElementById('breadcrumb').textContent = titles[page] || page;
  renderPage(page);
  // Trigger real data loads when Datagol is configured
  if (Datagol.isConfigured()) {
    if (page === 'dashboard')  { loadCandidates(); loadJobs(); }
    if (page === 'candidates') loadCandidates();
    if (page === 'jobs')       loadJobs();
    if (page === 'resumes')    { loadCandidates(); loadFiles(); }  // candidates needed for matching
    if (page === 'matching')   { loadCandidates(); loadJobs(); }
  }
}

function renderPage(page) {
  const content = document.getElementById('content');
  const renders = { dashboard: renderDashboard, resumes: renderResumes, candidates: renderCandidates, jobs: renderJobs, matching: renderMatching, settings: renderSettings };
  content.innerHTML = (renders[page] || renderDashboard)();
  afterRender(page);
}

// ============================================================
// DASHBOARD
// ============================================================
function renderDashboard() {
  const shortlisted = state.candidates.filter(c=>c.status==='shortlisted').length;
  const avgScore = state.candidates.length
    ? Math.round(state.candidates.reduce((a,c)=>a+c.score,0)/state.candidates.length)
    : 0;
  return `
  <div class="page-header">
    <div>
      <div class="page-title">Overview</div>
      <div class="page-sub">Welcome back — here's what's happening today</div>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-secondary btn-sm" onclick="navigate('resumes')">

function computeMatchScore(candidate, job) {
  const cSkills = candidate.skills.map(s => s.toLowerCase());
  const jSkills = job.skills.map(s => s.toLowerCase());
  const sharedSkills = cSkills.filter(s => jSkills.some(js => js.includes(s) || s.includes(js))).length;
  const skillPct  = Math.min(99, Math.round((sharedSkills / Math.max(jSkills.length, 1)) * 100 * 1.2 + 30));
  const expMin    = parseInt((job.exp || '0').match(/\d+/)?.[0] || '0');
  const expPct    = expMin === 0 ? 80 : Math.min(99, Math.round((candidate.exp / expMin) * 85));
  const seed      = (candidate.id * 13 + job.id * 7) % 25;
  const eduPct    = 65 + seed;
  const cultPct   = 60 + ((candidate.id * 11 + job.id * 9) % 30);
  const overall   = Math.round(skillPct * 0.40 + expPct * 0.30 + eduPct * 0.15 + cultPct * 0.15);
  const notes     = overall >= 90 ? 'Exceptional match — skills and experience align perfectly.'
                  : overall >= 75 ? 'Strong match. Candidate meets most key requirements.'
                  : overall >= 60 ? 'Fair match. Some gaps — worth a conversation.'
                  :                 'Weak match. Significant gaps in experience or skills.';
  return { candidate, job, overall, skills: skillPct, exp: expPct, edu: eduPct, culture: cultPct, notes };
}

function renderMatching() {
  // Build all candidate × job pairs, sort by score desc
  let allMatches = [];
  state.candidates.forEach(c => state.jobs.forEach(j => allMatches.push(computeMatchScore(c, j))));

  const matches = filterId ? visibleMatches.filter(m => m.candidate.id === filterId) : visibleMatches.slice(0, 8);

  return `

  <!-- Score legend -->

function openModal(type, data) {
  const modals = {
    'upload-resume': modalUploadResume,
    'add-candidate': modalAddCandidate,
    'add-job': modalAddJob,
    'candidate-detail': () => modalCandidateDetail(data),
    'run-ai-score': modalRunAIScore,
    'scrape-linkedin': modalScrapeLinkedIn,
    'match-config': modalMatchConfig,
  };
  const html = modals[type] ? modals[type]() : '';
  if (!html) return;
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal" onclick="event.stopPropagation()">${html}</div>
    </div>`;
}

function modalCandidateDetail(id) {
  const c = state.candidates.find(x=>x.id===id);
  if (!c) return '';
  // compute stable match scores (seeded by candidate id + job id so they don't flicker)
  const jobMatches = state.jobs.slice(0,3).map(j=>{
    const seed = (c.id * 31 + j.id * 17) % 40;
    const shared = c.skills.filter(s=>j.skills.some(js=>js.toLowerCase().includes(s.toLowerCase())||s.toLowerCase().includes(js.toLowerCase()))).length;
    const pct = Math.min(99, 55 + shared * 8 + (seed % 20));
    return { ...j, pct };
  });
  const isShortlisted = c.status === 'shortlisted';
  return `
  <div class="modal-header">
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="avatar" style="background:${getAvatarColor(c.id)};width:44px;height:44px;font-size:16px;">${getInitials(c.name)}</div>

      </div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
  </div>
  <div class="modal-body">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <div style="display:flex;gap:16px;">
        <div style="text-align:center;">
          ${scoreRing(c.score, 64)}
          <div style="font-size:10px;color:#475569;margin-top:4px;">AI Score</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;justify-content:center;">
          <div style="font-size:12px;color:#475569;">📧 ${c.email}</div>
          <div style="font-size:12px;color:#475569;">📞 ${c.phone}</div>
          <div style="font-size:12px;color:#475569;">💼 ${c.exp} years experience</div>
          <div style="font-size:12px;color:#475569;">🎓 ${c.education}</div>
        </div>
      </div>
      <div>
        <div id="candidate-status-badge-${c.id}">${statusBadge(c.status)}</div>
        <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px;">
          <button id="shortlist-btn-${c.id}" class="btn btn-sm ${isShortlisted ? 'btn-secondary' : 'btn-primary'}"

    </div>
    <div class="divider"></div>
    <div class="form-group">
      <label class="form-label">Summary</label>
      <div style="font-size:13px;color:#94a3b8;line-height:1.6;">${c.summary}</div>
    </div>
    <div class="form-group">
      <label class="form-label">Skills</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        ${c.skills.length ? c.skills.map(s=>`<span class="chip">${s}</span>`).join('') : '<span style="color:#475569;font-size:12px;">No skills extracted</span>'}
      </div>
    </div>
    <div class="form-group">

// ── Matches Table — create once, reuse forever ───────────────────────────────
let _matchesTableId = localStorage.getItem('dg_matches_table') || null;

async function ensureMatchesTable() {
  if (_matchesTableId) return _matchesTableId;
  // Create the table
  const tbl = await Datagol._dg('POST', `/noCo/api/v2/workspaces/${DG_WS}/tables`, {
    title: 'TalentAI — Job Matches', tableType: 'DYNAMIC',
    description: 'Candidate × job shortlist records'
  });
  _matchesTableId = tbl.id || tbl.tableId;
  localStorage.setItem('dg_matches_table', _matchesTableId);
  // Add columns
  const cols = [
    { name: 'candidate_name',  uiDataType: 'SINGLE_LINE_TEXT', uiMetadata: { title: 'Candidate Name' } },
    { name: 'candidate_email', uiDataType: 'SINGLE_LINE_TEXT', uiMetadata: { title: 'Email' } },
    { name: 'candidate_phone', uiDataType: 'SINGLE_LINE_TEXT', uiMetadata: { title: 'Phone' } },
    { name: 'candidate_location', uiDataType: 'SINGLE_LINE_TEXT', uiMetadata: { title: 'Location' } },
    { name: 'candidate_skills', uiDataType: 'LONG_TEXT',       uiMetadata: { title: 'Skills' } },
    { name: 'ai_score',        uiDataType: 'NUMBER',           uiMetadata: { title: 'AI Score' } },
    { name: 'job_title',       uiDataType: 'SINGLE_LINE_TEXT', uiMetadata: { title: 'Job Title' } },
    { name: 'company',         uiDataType: 'SINGLE_LINE_TEXT', uiMetadata: { title: 'Company' } },
    { name: 'job_location',    uiDataType: 'SINGLE_LINE_TEXT', uiMetadata: { title: 'Job Location' } },
    { name: 'job_type',        uiDataType: 'SINGLE_LINE_TEXT', uiMetadata: { title: 'Job Type' } },
    { name: 'salary_range',    uiDataType: 'SINGLE_LINE_TEXT', uiMetadata: { title: 'Salary Range' } },
    { name: 'match_score',     uiDataType: 'NUMBER',           uiMetadata: { title: 'Match Score (%)' } },
    { name: 'skills_match',    uiDataType: 'NUMBER',           uiMetadata: { title: 'Skills Match (%)' } },
    { name: 'exp_match',       uiDataType: 'NUMBER',           uiMetadata: { title: 'Experience Match (%)' } },
    { name: 'status',          uiDataType: 'SINGLE_LINE_TEXT', uiMetadata: { title: 'Status' } },
    { name: 'matched_at',      uiDataType: 'SINGLE_LINE_TEXT', uiMetadata: { title: 'Matched At' } },
  ];
  for (const col of cols) {
    await Datagol._dg('POST', `/noCo/api/v2/workspaces/${DG_WS}/tables/${_matchesTableId}/column`, col).catch(() => {});
  }
  return _matchesTableId;
}

async function saveMatchToDatagol(candidate, job, scores) {
  try {
    const tableId = await ensureMatchesTable();
    await Datagol._dg('POST', `/noCo/api/v2/workspaces/${DG_WS}/tables/${tableId}/rows`, {
      cellValues: {
        candidate_name:     candidate.name,
        candidate_email:    candidate.email,
        candidate_phone:    candidate.phone   || '',
        candidate_location: candidate.location|| '',
        candidate_skills:   (candidate.skills || []).join('; '),
        ai_score:           candidate.score   || 0,
        job_title:          job.title,
        company:            job.company       || '',
        job_location:       job.location      || '',
        job_type:           job.type          || '',
        salary_range:       job.salary        || '',
        match_score:        scores?.overall   || 0,
        skills_match:       scores?.skills    || 0,
        exp_match:          scores?.exp       || 0,
        status:             'shortlisted',
        matched_at:         new Date().toISOString().slice(0, 10),
      }
    });
    toast(`✓ Match saved — ${candidate.name} × ${job.title}`, 'success');
  } catch (e) {
    console.warn('saveMatch:', e.message);
  }
}

async function shortlistCandidate(id, jobId) {
  const c = state.candidates.find(x => x.id === id);
  if (!c) return;
  const newStatus = c.status === 'shortlisted' ? 'reviewed' : 'shortlisted';
  c.status = newStatus;

  // Update badge + button in-place immediately
  const badgeEl = document.getElementById(`candidate-status-badge-${id}`);
  const btnEl   = document.getElementById(`shortlist-btn-${id}`);
  if (badgeEl) badgeEl.innerHTML = statusBadge(c.status);
  if (btnEl) {
    btnEl.textContent = c.status === 'shortlisted' ? '✓ Shortlisted' : 'Shortlist';
    btnEl.className   = `btn btn-sm ${c.status === 'shortlisted' ? 'btn-secondary' : 'btn-primary'}`;
  }
  toast(c.status === 'shortlisted' ? `${c.name} added to shortlist!` : `${c.name} removed from shortlist.`, 'success');

  // When shortlisting from the matching page, save candidate+job record to matches workbook
  if (newStatus === 'shortlisted' && jobId) {
    const j = state.jobs.find(x => x.id == jobId);
    if (j) {
      const scores = computeMatchScore(c, j);
      saveMatchToDatagol(c, j, scores);
    }
  }
  // Note: do NOT call updateCandidate here — 'status' column doesn't exist in extraction table
}

async function sendInterviewInvite(candidateId) {
  const c = state.candidates.find(x => x.id === candidateId);
  if (!c) return;

  const date     = document.getElementById('iv-date')?.value     || '—';
  const time     = document.getElementById('iv-time')?.value     || '—';
  const type     = document.getElementById('iv-type')?.value     || 'Video Call';
  const duration = document.getElementById('iv-duration')?.value || '45 mins';
  const link     = document.getElementById('iv-link')?.value     || '';
  const notes    = document.getElementById('iv-notes')?.value    || '';

  const btn = document.querySelector('#modal-box .modal-footer .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }

  const emailBody = `Hi ${c.name},\n\nWe'd like to invite you for a ${type} interview.\n\nDetails:\n• Date: ${date}\n• Time: ${time}\n• Duration: ${duration}\n• Format: ${type}\n${link ? `• Link/Location: ${link}\n` : ''}${notes ? `\nNotes: ${notes}\n` : ''}\nLooking forward to speaking with you!\n\nBest regards,\nRecruitment Team`;

  try {
    const cfg = state.apiConfig;
    if (cfg.token && cfg.workspaceId) {
      await fetch(`${cfg.baseUrl || 'https://be.datagol.ai'}/noCo/api/v2/workspaces/${cfg.workspaceId}/email-campaigns`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${cfg.token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: `Interview Invite – ${c.name}`,
          to: [{ email: c.email, name: c.name }],
          subject: `Interview Invitation – ${type} on ${date}`,
          body: emailBody,
          type: 'transactional',
          metadata: { candidateId: c.id, interviewDate: date, interviewTime: time, interviewType: type },
        }),
      });
    }
  } catch (err) {
    console.warn('Datagol email API error (non-fatal):', err);
  }

  // Update candidate status
  c.status = 'reviewed';
  toast(`📨 Interview invite sent to ${c.email} for ${date} at ${time}!`, 'success');
  closeModal();
  if (state.page === 'candidates') renderPage('candidates');
}

function toast(msg, type='info') {
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  const el = document.createElement('div');

  setTimeout(() => el.remove(), 3500);
}

async function deleteResume(id) {
  const resume = state.resumes.find(r => r.id === id);
  if (!resume) return;

  const candidateName = resume.candidate;
  const msg = candidateName
    ? `Delete "${resume.name}" and remove candidate profile "${candidateName}"?`
    : `Delete "${resume.name}"?`;
  if (!confirm(msg)) return;

  // Find matching candidate (for Datagol row ID)
  const linkedCandidate = candidateName
    ? state.candidates.find(c => c.name === candidateName)
    : null;

  // Delete from Datagol via backend
  if (linkedCandidate?.id) {
    await Datagol.deleteCandidates([linkedCandidate.id])
      .catch(e => console.warn('Could not delete candidate row:', e.message));
  }

  // Remove from local state
  state.resumes    = state.resumes.filter(r => r.id !== id);
  state.candidates = state.candidates.filter(c => c.name !== candidateName);

  toast(
    candidateName
      ? `Deleted resume + candidate profile "${candidateName}"`
      : 'Resume deleted.',
    'info'
  );
  renderPage('resumes');
}

function filterResumes(filter, tabEl) {

// Set PDF.js worker (CDN must match version above)
if (typeof pdfjsLib !== 'undefined') {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

async function extractPdfText(file) {
  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = '';
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      fullText += content.items.map(i => i.str).join(' ') + '\n';
    }
    return { text: fullText, pages: pdf.numPages };
  } catch (err) {
    console.warn('PDF.js extraction failed:', err);
    return { text: '', pages: 1 };
  }
}

function parseResumeText(text, fallbackName) {
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);

  // ── Name: first non-empty line that looks like a proper name ──────────────
  let name = fallbackName;
  for (const l of lines.slice(0, 4)) {
    if (/^[A-Z][a-z]+ [A-Z][a-z]+/.test(l) && l.split(' ').length <= 4) { name = l; break; }
  }

  // ── Role / title: second meaningful line ──────────────────────────────────
  let role = '';
  for (const l of lines.slice(1, 6)) {
    if (l !== name && !/📍|📞|📧|🌐|💼|@/.test(l) && l.length > 4 && l.length < 60) { role = l; break; }
  }

  // ── Contact details ────────────────────────────────────────────────────────
  const emailMatch   = text.match(/[\w.+-]+@[\w.-]+\.[a-z]{2,}/i);
  const email        = emailMatch ? emailMatch[0] : `${name.toLowerCase().replace(/ /g,'.')}@email.com`;

  const phoneMatch   = text.match(/(\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]\d{3}[\s.-]\d{4}/);
  const phone        = phoneMatch ? phoneMatch[0].trim() : '—';

  const locMatch     = text.match(/📍\s*([^\n|📞📧🌐💼]+)/);
  const location     = locMatch ? locMatch[1].trim().replace(/\s*\|.*/, '') : '—';

  // ── Experience (years) ─────────────────────────────────────────────────────
  let exp = 0;
  const expMatch = text.match(/(\d+)\+?\s*years?\s*of\s*experience/i);
  if (expMatch) {
    exp = parseInt(expMatch[1]);
  } else {
    // Try counting job entries (rough heuristic: number of date ranges)
    const dateRanges = (text.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+\d{4}/gi) || []);
    exp = Math.max(0, Math.floor(dateRanges.length / 2));
  }

  // ── Summary ────────────────────────────────────────────────────────────────
  let summary = '';
  const sumIdx = text.search(/PROFESSIONAL SUMMARY|SUMMARY|PROFILE/i);
  if (sumIdx > -1) {
    const chunk = text.slice(sumIdx).replace(/PROFESSIONAL SUMMARY|SUMMARY|PROFILE/i, '').trim();
    const end   = chunk.search(/\n\s*[A-Z ]{4,}\n|TECHNICAL SKILLS|EXPERIENCE|EDUCATION/i);
    summary = chunk.slice(0, end > 0 ? end : 400).replace(/\s+/g, ' ').trim();
  }

  // ── Skills ─────────────────────────────────────────────────────────────────
  const skillKeywords = [
    'React','Next.js','Angular','Vue','TypeScript','JavaScript','Python','Java','Node.js',
    'SQL','PostgreSQL','MongoDB','AWS','Azure','GCP','Docker','Kubernetes','GraphQL','REST',
    'Redux','Tailwind','Sass','Bootstrap','Git','CI/CD','Jest','Cypress','Figma','Agile','Scrum'
  ];
  const skills = skillKeywords.filter(sk => new RegExp('\\b' + sk.replace('.','\\.')+'\\b','i').test(text));

  // ── Education ──────────────────────────────────────────────────────────────
  const eduMatch = text.match(/Bachelor[^,\n|]+|Master[^,\n|]+|PhD[^,\n|]+|B\.S\.[^,\n|]+|M\.S\.[^,\n|]+|B\.E\.[^,\n|]+/i);
  const education = eduMatch ? eduMatch[0].trim() : '—';

  // ── AI Score (simple heuristic based on richness) ─────────────────────────
  const score = Math.min(99, 50 + skills.length * 3 + (exp > 0 ? exp * 2 : 0) + (summary.length > 100 ? 10 : 0));

  return { name, role: role || 'Professional', email, phone, location, exp, summary, skills, education, score };
}

async function simulateUpload() {
  const inp   = document.getElementById('file-inp');
  const files = inp?.files?.length ? [...inp.files] : (state._pendingDropFiles || []);
  state._pendingDropFiles = null;

  if (!files.length) { toast('No PDF file selected.', 'error'); return; }
  closeModal();

  for (const file of files) {
    const entry = {
      id: `local-${Date.now()}-${Math.random().toString(36).slice(2)}`,
      name: file.name,
      size: `${Math.round(file.size / 1024)} KB`,
      uploaded: 'Just now',
      status: 'uploading',
      candidate: null,
      pages: '—',
      _file: file,
    };
    state.resumes.unshift(entry);
    if (state.page === 'resumes') renderPage('resumes');

    if (Datagol.isConfigured()) {
      // ── REAL DATAGOL FLOW ─────────────────────────────────
      try {
        toast(`📤 Uploading "${file.name}" to Datagol…`, 'info');

        // Step 1 — Upload directly to Datagol into the resume folder (parentId param)
        const uploaded = await uploadToBackend(file);
        // Response fields: id (UUID), name, byteSize, parentId, type
        const fileId = uploaded?.id;
        if (!fileId) throw new Error('Upload succeeded but no file ID returned');

        entry.id   = fileId;
        entry.size = uploaded?.byteSize ? `${Math.round(uploaded.byteSize / 1024)} KB` : entry.size;
        delete entry._file;

        // Step 2 — Trigger extraction via backend
        entry.status = 'extracting';
        if (state.page === 'resumes') renderPage('resumes');
        toast(`🔍 Running Datagol extraction on "${file.name}"…`, 'info');

        const runRes    = await Datagol.triggerExtraction(fileId);
        const requestId = runRes?.requestId;

        if (requestId) {
          // Step 3 — Poll status every 10s until done
          await pollExtractionStatus(requestId, entry, file.name);
        } else {
          // Extraction queued but no requestId — mark optimistically
          entry.status    = 'extracted';
          entry.candidate = deriveCandidateName(file.name);
          if (state.page === 'resumes') renderPage('resumes');
          setTimeout(loadCandidates, 3000);
        }

      } catch (err) {
        console.error('Datagol upload error:', err);
        entry.status = 'failed';
        delete entry._file;
        toast(`Upload failed for "${file.name}": ${err.message}`, 'error');
        if (state.page === 'resumes') renderPage('resumes');
      }

    } else {
      // ── LOCAL PDF.js FALLBACK (no API configured) ─────────
      entry.status = 'extracting';
      if (state.page === 'resumes') renderPage('resumes');
      toast(`Extracting "${file.name}" locally (simulation mode — configure Datagol in Settings)…`, 'info');

      try {
        const { text, pages } = await extractPdfText(file);
        const fallback = deriveCandidateName(file.name);
        const parsed   = parseResumeText(text, fallback);

        entry.status    = 'extracted';
        entry.candidate = parsed.name;
        entry.pages     = pages;
        delete entry._file;

        state.candidates.unshift({
          id: Date.now() + Math.random(),
          name: parsed.name, email: parsed.email, phone: parsed.phone,
          role: parsed.role, location: parsed.location,
          exp: parsed.exp, score: parsed.score, status: 'new',
          skills: parsed.skills, education: parsed.education,
          summary: parsed.summary || 'Profile extracted from uploaded resume.',
        });
        toast(`✓ "${parsed.name}" extracted — ${parsed.skills.length} skills, ${parsed.exp}y exp`, 'success');
      } catch (err) {
        entry.status = 'failed';
        delete entry._file;
        toast(`Failed to extract "${file.name}"`, 'error');
      }
      if (state.page === 'resumes') renderPage('resumes');
    }
  }
}

async function simulateAIScore() {
  const sel      = document.getElementById('score-job-select');
  const jobDesc  = sel ? sel.value : '';
  const jobLabel = sel?.options[sel.selectedIndex]?.text || '';
  const total    = state.candidates.length;

  if (!total) { toast('No candidates to score', 'error'); return; }

  const jobCtx = jobLabel && jobLabel !== '— Select a job (optional) —' ? ` against "${jobLabel}"` : '';
  toast(`🤖 Scoring ${total} candidate${total !== 1 ? 's' : ''}${jobCtx}…`, 'info');

  try {
    const res = await Datagol.runAIScore(jobDesc, (done, total, name, r) => {
      const score = r?.cellValues?.ai_scoring;
      if (score != null) toast(`✓ ${name} — score: ${score}`, 'success');
    });

    if (res.errors?.length) {
      res.errors.forEach(e => toast(`⚠ ${e.name}: ${e.error}`, 'error'));

    toast(`🎯 AI scoring complete — ${res.scored}/${res.total} candidates scored!`, 'success');

    // Reload from Datagol to persist the scores
    setTimeout(loadCandidates, 2000);
  } catch (e) {
    toast(`AI scoring failed: ${e.message}`, 'error');
  }
}

const Datagol = {

  // ── Local backend helper (candidates, jobs, matching) ─────
  async _api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const r = await fetch(path, opts);
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `${method} ${path} → ${r.status}`);
    return data;
  },
  get(p)        { return this._api('GET',    p, undefined); },
  post(p, body) { return this._api('POST',   p, body); },
  put(p, body)  { return this._api('PUT',    p, body); },
  del(p, body)  { return this._api('DELETE', p, body); },

  // ── Direct Datagol helper (upload, extraction, poll) ──────
  async _dg(method, path, body) {
    const opts = { method, headers: { 'x-auth-token': DG_TOKEN, 'Content-Type': 'application/json' } };
    if (body !== undefined) opts.body = JSON.stringify(body);
    const r = await fetch(`${DG_BASE}${path}`, opts);
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || data.message || `${method} ${path} → ${r.status}`);
    return data;
  },

  isConfigured() { return true; },

  // ── Workspace setup ───────────────────────────────────────
  setup()  { return this.post('/api/setup'); },
  test()   { return this.get('/api/test'); },
  health() { return this.get('/api/health'); },
  updateConfig(cfg) { return this.post('/api/config', cfg); },

  // ── Files ─────────────────────────────────────────────────
  listFiles()   { return this.get('/api/files'); },

  // ── Candidates — cursor API called directly ───────────────
  // Cursor response: { rows: [{ id, cellValues: { full_name, email, ... } }] }
  async getCandidates() {
    const raw = await this._dg('POST',
      `/noCo/api/v2/workspaces/${DG_WS}/tables/${DG_CAND_TABLE}/cursor`,
      { dataProvider: 'JDBC', lastCursorValues: {}, requestPageDetails: { pageNumber: 1, pageSize: 500 }, sortOptions: [], filterParams: {} }
    );
    const rows = raw?.rows || raw?.list || [];
    const candidates = rows
      .filter(row => row.cellValues?.full_name || row.cellValues?.email)
      .map(row => {
        const v = row.cellValues;            // all fields live here
        const rowId = row.id;               // numeric row ID at top level

        const skillsRaw = v.skills || '';
        let role = 'Professional';
        if (v.work_experience) {
          const first = v.work_experience.split(';')[0].trim();
          const parts = first.split('|');
          role = parts.length >= 2 ? `${parts[0].trim()} at ${parts[1].trim()}` : first.slice(0, 80);
        }
        let summary = v.summary || '';
        if (!summary && v.datagol_extracted_file_data) {
          try { summary = JSON.parse(v.datagol_extracted_file_data).summary || ''; } catch { /* */ }
        }
        return {
          id:             rowId,
          name:           v.full_name || v.name || '—',
          email:          v.email || '—',
          phone:          v.phone_number || v.phone || '—',
          location:       v.location || '—',
          role,
          exp:            parseFloat(v.total_experience) || 0,
          score:          parseInt(v.ai_scoring || v.ai_score) || 0,
          status:         v.status || 'new',
          skills:         typeof skillsRaw === 'string'
                            ? skillsRaw.split(/[;,]/).map(s => s.trim()).filter(Boolean)
                            : [],
          education:      v.education || '—',
          summary,
          resumeFileName: v.datagol_extracted_file_url ? v.datagol_extracted_file_url.split('/').pop() : null,
          _raw: { ...v, _rowId: rowId },   // include row id for aiGenerate
        };
      });
    return { ok: true, candidates, total: raw?.totalNumberOfRecords || candidates.length };
  },
  addCandidate(data)    { return this.post('/api/candidates', data); },
  deleteCandidates(ids) { return this.del('/api/candidates', { rowIds: ids }); },

  // Update candidate row directly on Datagol (bypasses local proxy)
  // NOTE: 'status' is NOT a column in the extraction table — never include it here
  updateCandidate(id, updates) {
    const cellValues = {};
    if (updates.name     != null) cellValues.full_name    = updates.name;
    if (updates.email    != null) cellValues.email        = updates.email;
    if (updates.phone    != null) cellValues.phone_number = updates.phone;
    if (updates.location != null) cellValues.location     = updates.location;
    if (updates.skills   != null) cellValues.skills       = Array.isArray(updates.skills) ? updates.skills.join('; ') : updates.skills;
    if (updates.education!= null) cellValues.education    = updates.education;
    if (Object.keys(cellValues).length === 0) return Promise.resolve({ ok: true }); // nothing valid to update
    return this._dg('PUT',
      `/noCo/api/v2/workspaces/${DG_WS}/tables/${DG_CAND_TABLE}/rows`,
      { id, cellValues }
    );
  },

  // ── AI Scoring — calls aiGenerate per candidate, reads score back into state ──
  // Request:  POST .../tables/{tableId}/{scoreColId}/aiGenerate
  //           body: { id: rowId, cellValues: {...candidateFields}, cellValuesByColumnId: {} }
  // Response: { id, cellValues: { ai_scoring: "8", ...allFields } }
  async runAIScore(jobDescription, onProgress) {
    let scored = 0;
    const errors = [];

    for (let i = 0; i < state.candidates.length; i++) {
      const c = state.candidates[i];
      if (!c._raw) continue;

      // Strip internal key; send clean cellValues exactly as Datagol expects
      const { _rowId, ...cellVals } = c._raw;
      // Attach job description as context if a job was selected
      if (jobDescription) cellVals.job_description = jobDescription;

      const body = { id: c.id, cellValues: cellVals, cellValuesByColumnId: {} };

      const r = await this._dg('POST',
        `/noCo/api/v2/workspaces/${DG_WS}/tables/${DG_CAND_TABLE}/${DG_SCORE_COL}/aiGenerate`,
        body
      ).catch(e => ({ _error: e.message, id: c.id }));

      if (r?._error) {
        errors.push({ name: c.name, error: r._error });
      } else {
        // ── Read score back from response and update state immediately ──
        const newScore = parseInt(r?.cellValues?.ai_scoring) || 0;
        state.candidates[i] = { ...c, score: newScore };
        scored++;
        // Re-render live so score updates as each candidate finishes
        if (state.page === 'candidates' || state.page === 'dashboard') renderPage(state.page);
      }

      // Report progress to caller (e.g. for toast updates)
      if (onProgress) onProgress(i + 1, state.candidates.length, c.name, r);
    }

    return { ok: true, scored, total: state.candidates.length, errors };
  },

  // ── Jobs ──────────────────────────────────────────────────
  getJobs()          { return this.get('/api/jobs'); },
  addJob(data)       { return this.post('/api/jobs', data); },
  updateJob(id, data){ return this.put(`/api/jobs/${id}`, data); },
  deleteJobs(ids)    { return this.del('/api/jobs', { rowIds: ids }); },

  // ── Extraction — calls Datagol directly ───────────────────
  async triggerExtraction(fileId, extractionConfigId) {
    const extId = extractionConfigId || DG_EXT_ID;
    if (!extId) throw new Error('Extraction config ID not set.');
    return this._dg('POST',
      `/noCo/api/v2/workspaces/${DG_WS}/extraction/${extId}/FILE/${fileId}/run?extractOnlyNew=false`,
      {}
    );
  },
  pollStatus(requestId) {
    return this._dg('GET', `/noCo/api/v1/requestLog/status/${requestId}`);

  // ── Email Campaign — POST /tables/{tableId}/actions ───────

      `<p></p>` +
      `<p>We were impressed with your skills and experience for the <strong>${jobLabel}</strong>. ` +
      `We would like to schedule a follow-up discussion to go over the next steps in the process.</p>` +
      `<p><strong>Proposed Schedule:</strong><br>` +
      `Date: ${new Date(Date.now() + 9 * 86400000).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}<br>` +
      `Time: 9:00 AM – 10:00 AM (EST)</p>` +
      `<p>Please let us know if this time works for you, or feel free to suggest an alternative that better fits your schedule.</p>` +
      `<p>We look forward to speaking with you again.</p>` +
      `<p>Best regards,<br>DataGOL Team</p>`;

    return this._dg('POST',
      `/noCo/api/v2/workspaces/${DG_WS}/tables/${DG_CAND_TABLE}/actions`,
      {
        name:       `Email Campaign — ${jobLabel}`,
        actionType: 'EMAIL_CAMPAIGN',
        config: {
          template,
          emailColumn:        'to_email',
          subject:            `DataGOL Interview Schedule — ${jobLabel}`,
          attachmentColumns:  [],
          subjectLineContent: `<p>DataGOL Interview Schedule — ${jobLabel}</p>`,
          templateId:         DG_EMAIL_TEMPLATE_ID,
        },
      }
    );
  },

  // ── Matching ──────────────────────────────────────────────
  getMatches(candidateId) {
    const q = candidateId ? `?candidateId=${candidateId}` : '';
    return this.get(`/api/matches${q}`);
  },
};

// ── Upload file directly to Datagol API (deposited into DG_FOLDER_ID) ───────
async function uploadToBackend(file) {
  const form = new FormData();
  form.append('files', file);

  const r = await fetch(
    `${DG_BASE}/noCo/api/v2/workspaces/${DG_WS}/folder/upload?parentId=${DG_FOLDER_ID}`,
    { method: 'POST', headers: { 'x-auth-token': DG_TOKEN }, body: form }
  );
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || data.message || `Upload failed: ${r.status}`);
  // Response is an array — return first file entry
  const uploaded = Array.isArray(data) ? data[0] : data;
  return uploaded;
}

// ── Setup Workspace via backend ───────────────────────────────────────────────
async function setupWorkspace() {
  const wsId = document.getElementById('cfg-workspace')?.value?.trim();
  if (!wsId) { toast('Enter your Workspace ID first', 'error'); return; }

  // Push workspace ID to backend config
  await Datagol.updateConfig({ workspaceId: wsId }).catch(() => {});
  state.apiConfig.workspaceId = wsId;
  localStorage.setItem('datagol_config', JSON.stringify(state.apiConfig));

  const btn = document.getElementById('setup-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Setting up…'; }
  const setStatus = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };

  try {
    setStatus('setup-candidates', `<span class="badge badge-amber">Creating…</span>`);
    setStatus('setup-jobs',       `<span class="badge badge-amber">Creating…</span>`);
    setStatus('setup-extraction', `<span class="badge badge-amber">Creating…</span>`);

    const res = await Datagol.setup();

    setStatus('setup-candidates', res.candidatesTableId
      ? `<span class="badge badge-green">✓ Ready</span> <code style="font-size:10px;color:#475569;">${res.candidatesTableId.slice(0,12)}…</code>`
      : `<span class="badge badge-red">Failed</span>`);
    setStatus('setup-jobs', res.jobsTableId
      ? `<span class="badge badge-green">✓ Ready</span> <code style="font-size:10px;color:#475569;">${res.jobsTableId.slice(0,12)}…</code>`
      : `<span class="badge badge-red">Failed</span>`);
    setStatus('setup-extraction', res.extractionConfigId
      ? `<span class="badge badge-green">✓ Ready</span> <code style="font-size:10px;color:#475569;">${String(res.extractionConfigId).slice(0,12)}…</code>`
      : `<span class="badge badge-red">Failed</span>`);

    if (btn) { btn.disabled = false; btn.textContent = '✓ Complete'; btn.className = 'btn btn-secondary btn-sm'; }
    toast('🎉 Workspace ready! Tables and extraction config created.', 'success');
  } catch (err) {
    toast(`Setup failed: ${err.message}`, 'error');
    if (btn) { btn.disabled = false; btn.textContent = '⚠ Retry Setup'; }
  }
}

// ── Load Candidates from Datagol cursor API ───────────────────────────────────
async function loadCandidates() {
  try {
    const data = await Datagol.getCandidates();
    state.candidates = data.candidates || [];

    if (state.page === 'candidates') renderPage('candidates');
    if (state.page === 'dashboard')  renderPage('dashboard');
    if (state.page === 'matching')   renderPage('matching');

    // If resumes tab is open, refresh to re-match files ↔ candidates
    if (state.page === 'resumes') loadFiles();
  } catch (e) { console.warn('loadCandidates:', e.message); }
}

// ── Load Jobs from backend ────────────────────────────────────────────────────
async function loadJobs() {
  try {
    const data = await Datagol.getJobs();
    state.jobs = data.jobs || [];
    if (state.page === 'jobs')      renderPage('jobs');
    if (state.page === 'dashboard') renderPage('dashboard');
  } catch (e) { console.warn('loadJobs:', e.message); }
}

// ── Load Resumes from Datagol folder API ─────────────────────────────────────
async function loadFiles() {
  try {
    // GET /folder returns a tree; our uploads sit inside DG_FOLDER_ID
    const raw = await Datagol._dg('GET', `/noCo/api/v2/workspaces/${DG_WS}/folder`);

    let files = [];
    if (Array.isArray(raw)) {
      // Look for our folder node and read its children
      const folderNode = raw.find(f => f.id === DG_FOLDER_ID);
      if (folderNode?.children?.length) {
        files = folderNode.children.filter(f => !f.isFolder);
      } else {
        // Flat list — all items with matching parentId are our files
        const flat = raw.filter(f => !f.isFolder && f.parentId === DG_FOLDER_ID);
        files = flat.length ? flat : raw.filter(f => !f.isFolder);
      }
    }

    // Keep any uploads currently in progress (not yet saved to Datagol)
    const inProgress = state.resumes.filter(r => r.status === 'uploading' || r.status === 'extracting');

    state.resumes = files.map(f => {
      // Match to a candidate via datagol_extracted_file_url ending in file id, or filename
      const candidate = state.candidates.find(c =>
        c._raw?.datagol_extracted_file_url?.endsWith(f.id) || c.resumeFileName === f.name
      );
      return {
        id:        f.id,
        name:      f.name,
        size:      f.byteSize ? `${Math.round(f.byteSize / 1024)} KB` : '—',
        uploaded:  f.createDate ? new Date(f.createDate).toLocaleDateString() : '—',
        status:    candidate ? 'extracted' : 'uploaded',
        candidate: candidate ? candidate.name : null,
        pages:     '—',
      };
    });

    // Re-add in-progress uploads not yet in folder
    inProgress.forEach(r => {
      if (!state.resumes.find(x => x.id === r.id)) state.resumes.unshift(r);
    });

    if (state.page === 'resumes') renderPage('resumes');
  } catch (e) { console.warn('loadFiles:', e.message); }
}

// ── Poll extraction status every 30 s until DONE / FAILED ────────────────────
// Status API response: { id, status: "IN_PROGRESS"|"DONE"|"FAILED", eventName, eventId }
async function pollExtractionStatus(requestId, entry, fileName) {
  const INTERVAL_MS = 2_000;    // 2 seconds between polls
  const MAX_POLLS   = 300;      // give up after 300 × 2 s = 10 minutes
  let n = 0;
  return new Promise(resolve => {
    const iv = setInterval(async () => {
      n++;
      try {
        const s  = await Datagol.pollStatus(requestId);
        const st = (s?.status || '').toUpperCase();

        if (st === 'DONE' || st === 'COMPLETED' || st === 'SUCCESS') {
          clearInterval(iv);
          entry.status    = 'extracted';
          entry.candidate = deriveCandidateName(fileName);
          toast(`✓ "${fileName}" extraction complete!`, 'success');
          if (state.page === 'resumes') renderPage('resumes');
          // Reload both so candidates table gets the new row and resumes shows matched name
          await loadCandidates();
          await loadFiles();
          resolve();

        } else if (st === 'FAILED' || st === 'ERROR' || n >= MAX_POLLS) {
          clearInterval(iv);
          entry.status = 'failed';
          toast(
            n >= MAX_POLLS
              ? `Extraction timed out for "${fileName}" after ${Math.round(n * INTERVAL_MS / 60000)} min`
              : `Extraction failed for "${fileName}" (status: ${st})`,
            'error'
          );
          if (state.page === 'resumes') renderPage('resumes');
          resolve();

        } else {
          // Still IN_PROGRESS — update UI counter so user knows it's alive
          entry._pollCount = n;
          if (state.page === 'resumes') renderPage('resumes');
        }
      } catch (err) {
        console.warn('pollStatus error:', err.message);
        if (n >= MAX_POLLS) { clearInterval(iv); resolve(); }
      }
    }, INTERVAL_MS);
  });
}

function deriveCandidateName(fileName) {
  return fileName.replace(/\.pdf$/i,'').replace(/[_\-]/g,' ')
    .replace(/\b\w/g,c=>c.toUpperCase()).trim() || 'Unknown Candidate';
}

// ── Test Connection via backend ───────────────────────────────────────────────
async function testConnection() {
  const wsId = document.getElementById('cfg-workspace')?.value?.trim();
  if (!wsId) { toast('Enter Workspace ID first', 'error'); return; }

  await Datagol.updateConfig({ workspaceId: wsId }).catch(() => {});
  state.apiConfig.workspaceId = wsId;

  const btn = document.getElementById('test-conn-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Testing…'; }
  try {
    const res = await Datagol.test();
    toast(`✓ ${res.message}`, 'success');
    const ind = document.getElementById('conn-status');
    if (ind) ind.innerHTML = `<span class="badge badge-green">● Connected</span>`;
  } catch (e) {
    toast(`Connection failed: ${e.message}`, 'error');
    const ind = document.getElementById('conn-status');
    if (ind) ind.innerHTML = `<span class="badge badge-red">✗ Failed</span>`;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Test Connection'; }
  }
}

// ── Save manual config overrides ──────────────────────────────────────────────
async function saveConfig() {
  const wsId    = document.getElementById('cfg-workspace')?.value?.trim()    || '';
  const extId   = document.getElementById('cfg-extraction')?.value?.trim()   || '';
  const candId  = document.getElementById('cfg-candidates-wb')?.value?.trim()|| '';
  const jobsId  = document.getElementById('cfg-jobs-wb')?.value?.trim()      || '';
  const scoreId = document.getElementById('cfg-score-col')?.value?.trim()    || '';

  const update = {};
  if (wsId)    update.workspaceId        = wsId;
  if (extId)   update.extractionConfigId = extId;
  if (candId)  update.candidatesTableId  = candId;
  if (jobsId)  update.jobsTableId        = jobsId;
  if (scoreId) update.aiScoreColumnId    = scoreId;

  await Datagol.updateConfig(update).catch(e => console.warn('Config update:', e.message));
  Object.assign(state.apiConfig, update);
  localStorage.setItem('datagol_config', JSON.stringify(state.apiConfig));
  toast('✓ Configuration saved!', 'success');
}

// ============================================================
// CHARTS
// ============================================================
function afterRender(page) {
  if (page === 'dashboard') {
    // ── Weekly bar chart: last 6 weeks, count candidates added per week ──
    const now = Date.now();
    const weekMs = 7 * 24 * 60 * 60 * 1000;
    const weekLabels = [];
    const weekCounts = new Array(6).fill(0);
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now - i * weekMs);
      weekLabels.push(d.toLocaleDateString('en-US',{month:'short',day:'numeric'}));
    }
    // If we had timestamps we'd bucket by week; since we don't, spread evenly
    const total = state.candidates.length;
    if (total > 0) {
      // Put most recent additions in the last bucket
      weekCounts[5] = total;
    }

    const wCtx = document.getElementById('chart-weekly')?.getContext('2d');
    if (wCtx) new Chart(wCtx, {
      type: 'bar',
      data: {
        labels: weekLabels,
        datasets: [{
          label: 'Candidates',
          data: weekCounts,
          backgroundColor: 'rgba(99,102,241,0.7)',
          borderRadius: 6,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { color: '#1e2d4a' }, ticks: { color: '#475569', font: { size: 11 } } },
          y: { grid: { color: '#1e2d4a' }, ticks: { color: '#475569', font: { size: 11 }, stepSize: 1 }, beginAtZero: true }
        }
      }
    });

    // ── Status doughnut: real counts from state.candidates ──
    const countByStatus = s => state.candidates.filter(c => c.status === s).length;
    const newC        = countByStatus('new') + countByStatus('extracted');
    const reviewedC   = countByStatus('reviewed');
    const shortlistC  = countByStatus('shortlisted');
    const rejectedC   = countByStatus('rejected');
    const hasData     = (newC + reviewedC + shortlistC + rejectedC) > 0;

    const sCtx = document.getElementById('chart-status')?.getContext('2d');
    if (sCtx) new Chart(sCtx, {
      type: 'doughnut',
      data: {
        labels: ['New','Reviewed','Shortlisted','Rejected'],
        datasets: [{
          data: hasData ? [newC, reviewedC, shortlistC, rejectedC] : [1,0,0,0],
          backgroundColor: ['#3b82f6','#8b5cf6','#10b981','#ef4444'],
          borderWidth: 0, hoverOffset: 4
        }]
      },
      options: { responsive: false, cutout: '72%', plugins: { legend: { display: false } } }
    });
  }
}
