name: CI

on:
  push:
    branches: [ main ]
    paths: 
      - 'docs/**'
      - 'blog/**'
      - 'docusaurus.config.js'
      - 'sidebars.js'
      - 'static/**'
      - 'src/**'
      - 'package.json'
      
  pull_request:
    branches: [ main ]
    paths: 
      - 'docs/**'
      - 'blog/**'
      - 'docusaurus.config.js'
      - 'sidebars.js'
      - 'static/**'
      - 'src/**'
      - 'package.json'
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build